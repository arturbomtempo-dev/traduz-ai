{% load static %}
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TraduzAí — Tradutor de Arquivos</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="{% static 'core/css/style.css' %}" rel="stylesheet" />
    </head>

    <body>
        <main class="page-wrapper">
            <div class="card">
                <div class="logo">
                    <div class="logo-icon"><i data-lucide="languages"></i></div>
                    <h1>TraduzAí</h1>
                </div>
                <p class="subtitle">Traduza arquivos de texto do inglês para o português</p>

                {% if erro %}
                <div class="alert alert-error"><i data-lucide="alert-triangle"></i>{{ erro }}</div>
                {% endif %}

                <form
                    method="POST"
                    enctype="multipart/form-data"
                    action="{% url 'traduzir' %}"
                    id="upload-form"
                >
                    {% csrf_token %}

                    <label class="upload-area" id="upload-area">
                        <input type="file" name="arquivo" accept=".txt" required id="file-input" />
                        <div class="upload-icon"><i data-lucide="upload-cloud"></i></div>
                        <h3>Arraste seu arquivo aqui</h3>
                        <p>ou clique para selecionar — apenas .txt</p>
                    </label>

                    <div class="upload-file-info" id="file-info">
                        <i data-lucide="file-text"></i>
                        <span id="file-name"></span>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <span class="spinner"></span>
                        <span class="btn-label">Traduzir arquivo</span>
                    </button>
                </form>
            </div>
        </main>

        <footer>Feito com <i data-lucide="heart"></i> — <span>TraduzAí</span></footer>

        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script>
            lucide.createIcons();

            const input = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const fileName = document.getElementById('file-name');
            const area = document.getElementById('upload-area');
            const form = document.getElementById('upload-form');
            const btn = document.getElementById('submit-btn');

            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    fileName.textContent = input.files[0].name;
                    fileInfo.classList.add('visible');
                }
            });

            area.addEventListener('dragover', (e) => {
                e.preventDefault();
                area.classList.add('drag-over');
            });

            area.addEventListener('dragleave', () => area.classList.remove('drag-over'));

            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    input.files = e.dataTransfer.files;
                    fileName.textContent = e.dataTransfer.files[0].name;
                    fileInfo.classList.add('visible');
                }
            });

            form.addEventListener('submit', () => {
                btn.classList.add('loading');
                btn.disabled = true;
            });
        </script>
    </body>
</html>
