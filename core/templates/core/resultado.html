{% load static %}
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TraduzAí — Tradução Concluída</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="{% static 'core/css/style.css' %}" rel="stylesheet" />
    </head>

    <body>
        <main class="page-wrapper">
            <div class="card">
                <div class="logo">
                    <div class="logo-icon"><i data-lucide="languages"></i></div>
                    <h1>TraduzAí</h1>
                </div>

                <hr class="divider" />

                <div class="result-header">
                    <div class="result-header-icon">
                        <i data-lucide="check-circle-2"></i>
                    </div>
                    <div class="result-header-text">
                        <h2>Tradução concluída</h2>
                        <p>Confira o texto abaixo ou baixe o arquivo</p>
                    </div>
                </div>

                <div class="translation-box">
                    <p class="translation-box-label">
                        <i data-lucide="align-left"></i> Resultado em português
                    </p>
                    <textarea class="translation-text" readonly>{{ texto }}</textarea>
                </div>

                <div class="actions">
                    <a href="{{ arquivo }}" class="btn btn-accent" download>
                        <i data-lucide="download"></i> Baixar arquivo
                    </a>
                    <a href="/" class="btn btn-secondary">
                        <i data-lucide="arrow-left"></i> Traduzir outro
                    </a>
                </div>
            </div>
        </main>

        <footer>Feito com <i data-lucide="heart"></i> — <span>TraduzAí</span></footer>
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script>
            lucide.createIcons();
        </script>
    </body>
</html>
