{% extends "base.html" %}
{% load static %}

{% block title %}Página não encontrada | TraduzAí{% endblock %}

{% block extra_css %}
<link href="{% static 'core/css/404.css' %}" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="card error-page">
    <div class="logo">
        <div class="logo-icon"><i data-lucide="languages"></i></div>
        <h1>TraduzAí</h1>
    </div>

    <hr class="divider" />

    <div class="error-icon">
        <i data-lucide="file-search-2"></i>
    </div>

    <p class="error-code">404</p>

    <h2 class="error-title">Página não encontrada</h2>
    <p class="error-description">O endereço que você acessou não existe ou foi removido.</p>

    <div class="error-actions">
        <a href="/" class="btn btn-accent"> <i data-lucide="house"></i> Ir para o início </a>
    </div>
</div>
{% endblock %}
